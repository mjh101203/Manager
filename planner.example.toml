# 과제 수행 플래너 설정 — planner.toml 로 복사해서 수정 (config.toml과 같은 폴더)

[availability]
# 요일별 작업 가능한 시간. 여러 개는 쉼표, 없으면 "" . 자정까지는 "24:00"
mon = "19:30-23:00"
tue = "19:30-23:00"
wed = "19:30-23:00"
thu = "19:30-23:00"
fri = "19:30-22:00"
sat = "10:00-12:00, 14:00-18:00"
sun = "14:00-21:00"

[session]
min_minutes = 30            # 세션 최소 길이
max_minutes = 120           # 세션 최대 길이 (넘으면 나눔)
max_per_day_minutes = 180   # 하루에 과제 세션 최대 합
break_minutes = 10          # 세션 사이 휴식
buffer_hours = 12           # 마감 직전 비워둘 시간
all_day_deadline_time = "00:00"  # 날짜만 있는 마감의 기준 시각 (00:00 = 전날 밤까지 끝내기)
daily_reserve_minutes = 120 # 매일 비워둘 예비 시간 (그날 빈 시간 중 이만큼은 과제 세션을 안 넣음)
latest_end = "22:00"              # 이 시각 이후로는 과제 안 잡음
home_weekend_latest_end = "24:00" # 단, 귀가주 금·토는 이 시각까지 (귀가주 = 학사일정 그 주 금·토에 '미귀가' 없음)

[skills]
# 영역별 내 역량 1~10 — 1 = 평균적인 고등학생, 10 = 대학원생
# AI가 과제 주제를 작업 요소로 나눈 뒤, 요소별 필요 수준과 이 값을 비교해서 시간을 늘리거나 줄임
"파이썬" = 5
"딥러닝" = 4
"데이터 처리" = 4
"수학 이론" = 4
"물리 이론" = 3
"화학 이론" = 3
"생명 이론" = 3
"글쓰기" = 3
"자료조사" = 4
"발표" = 3
"하드웨어" = 3
"실험" = 3

[estimates]
# 유형별 기본 소요 시간(분, 평균 고등학생 기준) — 형식 참고용. 실제 추정은 주제·작업 요소·역량으로 함
"보고서" = 240
"발표" = 180
"문제풀이" = 90
"독서감상문" = 120
"자료조사" = 90
"실험" = 180
"암기" = 60
"기타" = 120

[me]
# AI가 참고할 나에 대한 메모 (예: "글쓰기는 느리고 계산 문제는 빠른 편. 저녁 집중 잘 됨")
note = ""
